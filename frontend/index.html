<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pharmacy POS - Starter</title>
  <style>
    body{font-family: Arial, Helvetica, sans-serif; margin:20px}
    .product{padding:8px;border-bottom:1px solid #eee}
    .cart{margin-top:20px}
  </style>
</head>
<body>
  <h2>Pharmacy POS - Starter</h2>
  <div>
    <input id="search" placeholder="Search product name..." style="width:60%" />
    <button onclick="search()">Search</button>
    <button onclick="loadAll()">Load All</button>
  </div>
  <div id="products"></div>

  <h3>Cart</h3>
  <div id="cartItems"></div>
  <div class="cart">
    <label>Payment:
      <select id="payment">
        <option>Cash</option><option>Card</option><option>UPI</option>
      </select>
    </label>
    <button onclick="checkout()">Checkout</button>
  </div>

<script>
  const API = window.location.origin;
  let products = [];
  let cart = [];
  function renderProducts(list){
    const el = document.getElementById('products');
    el.innerHTML = '';
    list.forEach(p=>{
      const div = document.createElement('div');
      div.className='product';
      div.innerHTML = `<strong>${p.product_name}</strong> (${p.generic_name || ''}) - MRP: ₹${p.mrp} - Stock: ${p.qty_on_hand || 0}
        <div>
          Qty: <input type="number" value="1" min="1" id="qty_${p.product_id}" style="width:60px" />
          <button onclick="addToCart(${p.product_id})">Add</button>
        </div>`;
      el.appendChild(div);
    });
  }
  function renderCart(){
    const el = document.getElementById('cartItems');
    el.innerHTML = '';
    let total=0;
    cart.forEach((c, idx)=>{
      total += c.unit_price * c.quantity;
      const d = document.createElement('div');
      d.innerText = c.product_name + ' x ' + c.quantity + ' = ₹' + (c.unit_price*c.quantity).toFixed(2);
      el.appendChild(d);
    });
    const t = document.createElement('div');
    t.style.marginTop='8px';
    t.innerHTML = '<strong>Total: ₹' + total.toFixed(2) + '</strong>';
    el.appendChild(t);
  }
  function loadAll(){
    fetch(API+'/products').then(r=>r.json()).then(data=>{
      products = data;
      renderProducts(products);
    });
  }
  function search(){
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = products.filter(p => p.product_name.toLowerCase().includes(q) || (p.generic_name || '').toLowerCase().includes(q));
    renderProducts(filtered);
  }
  function addToCart(productId){
    const p = products.find(x=>x.product_id==productId);
    const qty = parseInt(document.getElementById('qty_'+productId).value || '1',10);
    cart.push({ product_id: p.product_id, product_name: p.product_name, quantity: qty, unit_price: p.mrp || 0 });
    renderCart();
  }
  function checkout(){
    if(cart.length===0){ alert('Cart empty'); return; }
    const total = cart.reduce((s,i)=>s + i.unit_price*i.quantity,0);
    const payload = { total_amount: total, payment_method: document.getElementById('payment').value, items: cart };
    fetch(API+'/sales', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(r=>r.json()).then(res=>{
        if(res.error) { alert('Error: ' + res.error); } else { alert('Sale created ID: '+res.sale_id); cart=[]; renderCart(); loadAll(); }
      }).catch(e=>alert('Network error'));
  }
  // initial load
  loadAll();
</script>
</body>
</html>
